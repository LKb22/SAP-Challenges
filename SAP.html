<!DOCTYPE html>
<html lang="en">
<head>
  <title>My HTML5 Document</title>
  <link rel="stylesheet" href="SAP.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="container">
      <div id="about-me">
        <h1>About Me</h1>
        <p>Hello! Welcome to my personal blog.</p>
        <input type="text" id="email-input" placeholder="Enter your email">
        <button id="subscribe-button">Subscribe
        </button>
      </div>
      <table id="blog-posts">
        <tr>
          <th>Blog Title</th>
          <th>Published On</th>
        </tr>
        <tr>
          <td>My First Blog</td>
          <td>March 15, 2023</td>
        </tr>
        <tr>
          <td>My Second Blog</td>
          <td>June 25, 2023</td>
        </tr>
      </table>
      <ul id="favorite-blogs">
        <li><a href="https://blog1.example.com">Blog 1</a></li>
        <li><a href="https://blog2.example.com">Blog 2</a></li>
        <li><a href="https://blog3.example.com">Blog 3</a></li>
      </ul>
      </div>
<script src="SAP.js"></script>
</body>
</html>
